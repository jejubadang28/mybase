# 저장소에 파일이 올라오면 사이트를 만들어서 GitHub Pages에 올려요.
# 비밀번호는 저장소 Settings → Secrets and variables → Actions 의 STATICRYPT_PASSWORD 에서 읽어요.
# 나이스에서 바뀐 시간표를 받아 오려고 평일 아침·점심·저녁(한국 시간 6시 37분, 12시 37분, 18시 37분)과 일요일 저녁에도 다시 올려요.
name: 사이트 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 21 * * 0-4'
    - cron: '37 3,9 * * 1-5'
    - cron: '37 11 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 도구 설치
        run: npm install --no-audit --no-fund
      - name: 나이스 시간표 받기 (인증키가 없거나 안 되면 건너뛰어요)
        continue-on-error: true
        timeout-minutes: 3
        env:
          DRIVE_KEY: ${{ secrets.DRIVE_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: |
          COMCI="$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -a -pass env:DRIVE_KEY -in tools/school.enc)" \
            python3 tools/neis.py "$RUNNER_TEMP/timetable-live.json"
      - name: 사이트 만들기 (비밀번호로 잠그기)
        run: node build.mjs
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_KEY: ${{ secrets.DRIVE_KEY }}
          TIMETABLE_LIVE: ${{ runner.temp }}/timetable-live.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
