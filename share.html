<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY BASE 공개 자료실</title>
<script>try { if (localStorage.getItem('mybase-mode') === 'night') document.documentElement.setAttribute('data-mode', 'night'); } catch (e) {}</script>
<meta name="theme-color" content="#143D72">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="share">
<header class="band sticky">
  <div class="wrap bar simple">
    <a class="brand" href="share.html" aria-label="MY BASE 공개 자료실"><svg class="word" viewBox="0 0 520 112" aria-hidden="true"><text x="4" y="94" textLength="508" lengthAdjust="spacingAndGlyphs">MY BASE</text></svg></a>
    <div class="tools">
      <button class="mode-btn" type="button" data-mode-toggle aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <span class="lbl">밤 모드</span>
      </button>
      <a class="login-btn" href="index.html">로그인</a>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="share-hero" aria-labelledby="share-title">
    <h1 id="share-title">공개 자료실</h1>
    <p>로그인하지 않아도 볼 수 있는 발표와 파일이에요.</p>
  </section>

  <main class="board">
    <section class="panel" style="--i:0" aria-labelledby="h-sdecks">
      <div class="ph"><h2 id="h-sdecks">발표</h2><small><span data-n="pub-decks">2</span>개</small></div>
      <div class="pb">
        <div class="decks" id="share-decks"></div>
      </div>
    </section>

    <section class="panel" style="--i:1" aria-labelledby="h-sfiles">
      <div class="ph"><h2 id="h-sfiles">파일</h2><small><span data-n="pub-files">2</span>개</small></div>
      <div class="pb">
        <ul class="list" id="share-files"></ul>
      </div>
    </section>
  </main>

  <footer class="title-block" aria-label="사이트 정보">
    <div><span>이름</span><b>MY BASE</b></div>
    <div><span>페이지</span><b>공개 자료실</b></div>
    <div><span>보는 사람</span><b>누구나</b></div>
    <div><span>잠금</span><b>없음</b></div>
  </footer>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
