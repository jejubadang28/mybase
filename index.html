<!DOCTYPE html>
<html lang="ko" class="login-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY BASE 사이트</title>
<script>try { if (localStorage.getItem('mybase-mode') === 'night') document.documentElement.setAttribute('data-mode', 'night'); } catch (e) {}</script>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<!-- 미리보기용 로그인 화면이에요. 실제 사이트에서는 build.mjs 가 login-template.html 로 잠금 화면을 만들어요. -->
<div class="login-page">
  <header class="topbar">
    <button class="icon-btn" type="button" data-mode-toggle aria-pressed="false" aria-label="밤 모드로 바꾸기">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <span class="lbl sr-only">밤 모드</span>
    </button>
  </header>
  <main class="login-main">
    <span class="lock-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
    <h1 class="wordmark lg">MY BASE<span class="dot" aria-hidden="true"></span></h1>
    <form class="login-form" id="login-form" novalidate>
      <label class="sr-only" for="pw">비밀번호</label>
      <div class="pw-pill">
        <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-describedby="pw-err">
        <button class="text-btn" type="button" id="pw-toggle" aria-pressed="false" aria-controls="pw">보기</button>
      </div>
      <p class="err" id="pw-err" role="alert" hidden></p>
      <button class="btn primary lg" type="submit" id="login-btn">들어가기</button>
    </form>
    <a class="text-btn" href="share.html">공개 자료 보기</a>
  </main>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
